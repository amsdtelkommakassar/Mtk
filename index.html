  <body>
    <div id="hud"></div>
    <main id="app"></main>
    <button
      id="mbtn"
      class="btn warn mbtn pulse"
      onclick="MUS.toggle()"
      aria-pressed="false"
    >
      🎵 Putar Musik
    </button>
    <script>
      "use strict";
      /* ==========================================================================
   KONFIGURASI
   Supabase: isi projectUrl dan publishableKey di bawah.
   Gunakan publishable key saja. Jangan pernah menaruh sb_secret/service_role di HTML.
   ========================================================================== */
      const CFG = {
        supabase: {
          table: "hasil_kuis", // ganti jika memakai tabel Supabase lain untuk MTK
          projectUrl: "https://ijejesxfpxvwiefxivgy.supabase.co",
          publishableKey: "sb_publishable_yW_JT82as9xZNM6fTsm0aA_NWBzViGb",
        },
      };
      const $ = (s) => document.querySelector(s);
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const h53 = (s) => {
        let a = 0xdeadbeef,
          b = 0x41c6ce57;
        for (let i = 0; i < s.length; i++) {
          const c = s.charCodeAt(i);
          a = Math.imul(a ^ c, 2654435761);
          b = Math.imul(b ^ c, 1597334677);
        }
        a = Math.imul(a ^ (a >>> 16), 2246822507);
        a ^= Math.imul(b ^ (b >>> 13), 3266489909);
        b = Math.imul(b ^ (b >>> 16), 2246822507);
        b ^= Math.imul(a ^ (a >>> 13), 3266489909);
        return (4294967296 * (2097151 & b) + (a >>> 0)).toString(36);
      };
      const pick = (a) => a[Math.floor(Math.random() * a.length)];
      const fm = (n) => String(Math.round(n * 10) / 10).replace(".", ",");

      /* ===== PENYIMPANAN SUPABASE ===== */
      function lsGet() {
        try {
          return JSON.parse(localStorage.getItem("mtk_hasil") || "{}");
        } catch (e) {
          return {};
        }
      }
      function lsSet(r) {
        try {
          const o = lsGet();
          o[r.k] = r;
          localStorage.setItem("mtk_hasil", JSON.stringify(o));
        } catch (e) {}
      }
      const DB = {
        sb: null,
        note: "",
        un: null,
        uid: null,
        async init() {
          const c = CFG.supabase;
          if (
            !c.projectUrl ||
            c.projectUrl.includes("ISI_PROJECT_URL") ||
            !c.publishableKey
          ) {
            DB.note =
              "Isi Project URL Supabase pada CFG.supabase agar data tersimpan online.";
            return;
          }
          try {
            await new Promise((ok, no) => {
              const s = document.createElement("script");
              s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
              s.onload = ok;
              s.onerror = no;
              document.head.appendChild(s);
            });
            DB.sb = window.supabase.createClient(
              c.projectUrl,
              c.publishableKey,
            );
          } catch (e) {
            DB.note = "Supabase gagal dimuat. Periksa koneksi dan konfigurasi.";
          }
        },
        async anon() {
          const { data, error } = await DB.sb.auth.getSession();
          if (error) throw error;
          let u = data.session?.user;
          if (!u || !u.is_anonymous) {
            const r = await DB.sb.auth.signInAnonymously();
            if (r.error) throw r.error;
            u = r.data.user;
          }
          return u.id;
        },
        async put(r) {
          lsSet(r);

          if (!DB.sb || !DB.uid) {
            console.warn(
              "Supabase belum terhubung atau UID siswa belum tersedia.",
            );
            return false;
          }

          const row = {
            user_id: DB.uid,
            nama_siswa: r.nama,
            kelas: r.kode,
            nilai: r.nilai,
            skor: r.skor,
            maks: r.maks,
            benar: r.benar,
            salah: r.salah,
            jawab: r.jawab,
            prog: r.prog,
            status: r.status,
            detail_jawaban: r.det,
            created_at: r.t,
          };

          const { error } = await DB.sb
            .from(CFG.supabase.table)
            .upsert(row, { onConflict: "user_id" });

          if (error) {
            console.error("Gagal menyimpan hasil siswa:", error);
            return false;
          }

          console.log("Hasil siswa berhasil disimpan ke Supabase.");
          return true;
        },
        async watch(ok, no) {
          DB.stop();
          const load = async () => {
            const { data, error } = await DB.sb
              .from(CFG.supabase.table)
              .select(
                "user_id,nama_siswa,kelas,nilai,skor,maks,benar,salah,jawab,prog,status,detail_jawaban,created_at",
              )

        if (!lvDone(l)) return 0;
        const p =
          qsOf(l).reduce((s, q) => s + got(q), 0) /
          qsOf(l).reduce((s, q) => s + q.w, 0);
        return p >= 0.9 ? 3 : p >= 0.6 ? 2 : 1;
      };
      const nilai = () => Math.round((score() / maxs()) * 1000) / 10;
      const cat = (n) =>
        n >= 90 ? { t: "Hebat Sekali!", e: "kaget", m: "Wow, luar biasa! Kamu jagoan mengubah satuan panjang!" }

        : n >= 70 ? { t: "Terus Berlatih!", e: "semangat", m: "Kamu sudah di jalur yang benar. Ayo berlatih lagi supaya makin mantap!" }

      const badges = () => [
        ["🪜", "Penjaga Tangga", lvDone(1)],
        ["🔁", "Jagoan Ubah Satuan", lvDone(2)],
        ["📏", "Pemecah Soal Cerita", lvDone(3)],
        ["🌟", "Bintang Ukur", allDone() && nilai() >= 80],
      ];
      const keyOf = () =>
        (S.kode + "-" + S.nama).toLowerCase().replace(/[^a-z0-9]+/g, "-");
      function sesAll() {
        try {
          return JSON.parse(localStorage.getItem("mtk_sesi") || "{}");
        } catch (e) {
          return {};
        }
      }
      function loadSes(k) {
        return sesAll()[k] || null;
      }
      function saveSes() {
        if (S.role !== "siswa") return;
        try {
          const o = sesAll();
          o[keyOf()] = {
            ans: S.ans,
            tmp: S.tmp,
            pos: { v: V.v, p: { l: V.p.l, i: V.p.i } },
            t: Date.now(),
          };
          localStorage.setItem("mtk_sesi", JSON.stringify(o));
        } catch (e) {}
      }
      function resumePos(ses) {
        const p = ses && ses.pos;
        if (!p || !p.v) return null;
        if (p.v === "hasil") return allDone() ? ["hasil"] : null;
        if (p.v === "peta") return ["peta"];
        const l = p.p && p.p.l,
          i = p.p && p.p.i;
        if (![1, 2, 3].includes(l) || !lvOpen(l) || !(i >= 0)) return null;
        if (p.v === "materi" && i < msOf(l).length) return ["materi", { l, i }];
        if (p.v === "soal" && i < qsOf(l).length) return ["soal", { l, i }];
        if (p.v === "lvdone" && lvDone(l)) return ["lvdone", { l }];
        return null;
      }
      function save() {
        const a = Q.filter((q) => S.ans[q.id]),
          b = a.filter((q) => S.ans[q.id].p === q.w).length,
          sk = score(),
          det = {};
        a.forEach((q) => (det[q.id] = S.ans[q.id].p));
        DB.put({
          k: keyOf(),
          nama: S.nama,
          kode: S.kode,
          skor: sk,
          maks: maxs(),
          nilai: nilai(),
          benar: b,
          salah: a.length - b,
          jawab: a.length,
          prog: Math.round((a.length / Q.length) * 100),
          status:
            a.length === Q.length
              ? "Selesai"
              : a.length
                ? "Sedang bermain"
                : "Baru masuk",
          t: new Date().toISOString(),
          det,
        });
      }

      /* ===== EFEK ===== */
      function burst(n) {
        for (let i = 0; i < n; i++) {
          const e = document.createElement("span");
          e.className = "fx";
          e.textContent = ["⭐", "🎉", "✨", "🌟"][i % 4];
          e.style.left = Math.random() * 100 + "vw";
          e.style.animationDelay = Math.random() * 0.4 + "s";
          document.body.appendChild(e);
          setTimeout(() => e.remove(), 2400);
        }
      }
      function plus(t) {
        const e = document.createElement("div");
        e.className = "plus";
        e.textContent = t;
        document.body.appendChild(e);
        setTimeout(() => e.remove(), 1300);
      }

      /* ===== NAVIGASI ===== */
      function go(v, p) {
        V = { v, p: p || {} };
        render();
      }
      function render(keep) {
        if ((V.v === "dash" || V.v === "detail") && !S.guru)
          V = { v: "gate", p: {} };
        if (
          ["peta", "materi", "soal", "lvdone", "hasil"].includes(V.v) &&
          S.role !== "siswa"
        )
          V = { v: "gate", p: {} };
        saveSes();
        $("#app").innerHTML =
          '<div class="pg" ' +
          (keep ? 'style="animation:none"' : "") +
          ">" +
          VIEWS[V.v]() +
          "</div>";
        hud();
        if (!keep) window.scrollTo(0, 0);
        if (V.v !== "dash" && V.v !== "detail") DB.stop();
        if (V.v === "dash" && !V.p.rows) {
          if (DB.sb) {
            if (DB.un) {
              V.p.rows = ROWS;
              render(true);
            } else
              DB.watch(
                (r) => {
                  ROWS = r;
                  V.p.rows = r;
                  V.p.err = "";
                  if (V.v === "dash" || V.v === "detail") render(true);
                },
                (e) => {
                  console.error("Supabase dashboard error:", e);
                  V.p.rows = [];
                  V.p.err = "Gagal memuat data: " + (e?.message || String(e));
                  render(true);
                },
              );
          } else
            DB.list()
              .then((r) => {
                ROWS = r;
                V.p.rows = r;
                render(true);
              })
              .catch((e) => {
                console.error("Supabase dashboard error:", e);
                V.p.rows = [];
                V.p.err = "Gagal memuat data: " + (e?.message || String(e));
                render(true);
              });
        }
        if (S.pop) {
          S.pop = false;
          const s = $(".sc");
          if (s) s.classList.add("pp");
        }
      }
      function hud() {
        const h = $("#hud");
        if (S.role === "siswa") {
          const st = [1, 2, 3].reduce((s, l) => s + lvStars(l), 0),
            pg = Math.round(
              (Q.filter((q) => S.ans[q.id]).length / Q.length) * 100,
            );
          h.innerHTML =
            '<div class="hud"><div><b>📏 ' +
            esc(S.nama) +
            " (" +
            esc(S.kode) +
            ')</b><span><span class="chip sc">🪙 ' +
            fm(score()) +
            " / " +
            maxs() +
            '</span> <span class="chip">⭐ ' +
            st +

            pg +
            ' persen"><i style="width:' +
            pg +
            '%"></i></div></div>';
        } else if (S.guru)
          h.innerHTML =
            '<div class="hud"><div><b>🧑‍🏫 Mode Guru</b><span class="chip">Dashboard</span></div></div>';
        else h.innerHTML = "";
      }
      function keluar() {
        if (
          S.role === "siswa" &&
          !allDone() &&

            "Keluar sekarang? Progresmu tersimpan. Masuk lagi dengan nama dan kode kelas yang sama untuk melanjutkan.",

        DB.stop();
        DB.uid = null;
        if (DB.sb && S.guru) DB.sb.auth.signOut().catch(() => {});
        S = {
          role: null,
          guru: false,
          nama: "",
          kode: "",
          ans: {},
          tmp: {},
          fail: 0,
          until: 0,
          pop: false,
        };
        go("gate");
      }

      /* ===== TAMPILAN ===== */
      const VIEWS = {

        guru: () =>

          (DB.sb

          const jy = pos[tp][1],

              jx < 50 ? "left:" + (jx + 11) + "%" : "left:" + (jx - 30) + "%";
          return (

            '<div class="map"><svg viewBox="0 0 320 420" role="img" aria-label="Peta petualangan"><rect width="320" height="420" fill="#bfe9ff"/><circle cx="276" cy="36" r="20" fill="#ffd54a"/><ellipse cx="60" cy="50" rx="32" ry="11" fill="#fff"/><ellipse cx="92" cy="42" rx="22" ry="10" fill="#fff"/><path d="M0 120Q80 90 160 120T320 110V420H0Z" fill="#7ac36a"/><path d="M0 250Q100 220 200 250T320 240V420H0Z" fill="#4cb050"/><path d="M80 344C200 330 280 300 230 252S20 200 90 151S200 100 224 59" fill="none" stroke="#e9c47a" stroke-width="16" stroke-linecap="round"/><path d="M80 344C200 330 280 300 230 252S20 200 90 151S200 100 224 59" fill="none" stroke="#b88a3c" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>' +
            H(10, 320, "#fde68a", 0.7) +

            H(250, 180, "#fbcfe8", 0.6) +
            H(20, 110, "#bfdbfe", 0.6) +
            '<g fill="#2e7d32"><circle cx="40" cy="260" r="14"/><circle cx="290" cy="330" r="16"/><circle cx="150" cy="390" r="12"/><circle cx="20" cy="190" r="12"/></g><g fill="#7c3f1d"><rect x="38" y="272" width="4" height="10"/><rect x="288" y="344" width="4" height="10"/><rect x="148" y="400" width="4" height="10"/><rect x="18" y="200" width="4" height="10"/></g></svg>' +
            nodes +

            ";top:calc(" +

            '% - 12%)">' +

        },
        materi: () => {
          const l = V.p.l,

          return (
            '<div class="card"><div class="meta">Level ' +

            " dari " +

            "</div><h2>" +

            "</h2>" +
            SC[m.ill]() +
            bub(m.e, m.say) +
            m.pts.map((p) => '<div class="tile">' + p + "</div>").join("") +
            bub("semangat", m.tip) +
            '<div class="row"><button class="btn ghost" onclick="' +
            (i

            '">◀ ' +
            (i ? "Kembali" : "Peta") +
            '</button><button class="btn go" onclick="' +
            (last
              ? lvDone(l)

                  ",i:" +
                  Math.max(

              : "go('materi',{l:" + l + ",i:" + (i + 1) + "})") +
            '">' +

                ? "Lihat hasil level 🏁"
                : "Mulai soal ✏️"

          if (q.type === "num") {

      /* ===== AKSI ===== */
      function err(t) {
        const e = $("#er");
        e.textContent = t;
        e.hidden = false;
      }
      async function mulai() {
        const n = $("#nm").value.trim().replace(/\s+/g, " "),
          k = $("#kd").value.trim().toUpperCase().replace(/\s+/g, "");
        if (n.length < 2) return err("Tulis namamu dulu, minimal 2 huruf ya.");
        if (k.length < 2) return err("Tulis kode kelasmu dulu ya.");
        S = {
          role: "siswa",
          guru: false,
          nama: n,
          kode: k,
          ans: {},
          tmp: {},
          fail: 0,
          until: 0,
          pop: false,
        };
        if (DB.sb) {
          try {
            DB.uid = await DB.anon();
          } catch (e) {
            DB.uid = null;
            alert(
              "Koneksi ke server belum aktif. Nilaimu tersimpan di perangkat ini dulu.",
            );
          }
        }
        const k0 = keyOf(),
          ses = loadSes(k0);
        let back = false;
        if (ses && ses.ans && Object.keys(ses.ans).length) {
          S.ans = ses.ans;
          S.tmp = ses.tmp || {};
          back = true;
        } else {
          const old = lsGet()[k0];
          if (old && old.det) {
            Object.keys(old.det).forEach((id) => {
              const q = Qb(+id);
              if (q)
                S.ans[q.id] = {
                  p: old.det[id],
                  sel: -1,
                  e: old.det[id] === q.w ? "senang" : "pikir",
                  m: "Jawabanmu tadi sudah tersimpan.",
                };
            });
            back = Object.keys(S.ans).length > 0;
          }
        }
        save();
        burst(10);
        const r = back ? resumePos(ses) : null;
        go(...(r || ["peta"]));
        if (back) plus("Selamat datang kembali! 👋");
      }
      function ulang() {
        S.ans = {};
        S.tmp = {};
        save();
        go("peta");
      }
      async function masuk() {
        if (Date.now() < S.until)
          return err("Terlalu banyak percobaan. Tunggu 30 detik.");
        const pw = $("#pw").value;
        let ok = false;
        try {
          if (DB.sb) {
            const { data, error } = await DB.sb.auth.signInWithPassword({
              email: $("#em").value.trim(),
              password: pw,
            });
            if (error) throw error;
            const check = await DB.sb
              .from("guru_access")
              .select("user_id")
              .eq("user_id", data.user.id)
              .maybeSingle();
            if (check.error || !check.data)
              throw new Error("Akun ini belum diberi akses guru.");
            ok = true;
          } else {
            let s = null;
            try {
              s = localStorage.getItem("mtk_pw");
            } catch (e) {}
            if (!s) {
              if (pw.length < 6)
                return err("Buat sandi baru, minimal 6 karakter.");
              try {
                localStorage.setItem("mtk_pw", h53("mtk:" + pw));
              } catch (e) {}
              ok = true;
            } else ok = h53("mtk:" + pw) === s;
          }
        } catch (e) {
          ok = false;
        }
        if (!ok) {
          if (++S.fail >= 5) {
            S.until = Date.now() + 30000;
            S.fail = 0;
          }
          return err(
            DB.sb
              ? "Email/sandi salah atau akun belum terdaftar sebagai guru."
              : "Sandi salah.",
          );
        }
        S.role = "guru";
        S.guru = true;
        go("dash");
      }
      function gantiSandi() {
        const p = prompt("Sandi baru (minimal 6 karakter):");
        if (!p) return;
        if (p.length < 6) return alert("Sandi terlalu pendek.");
        try {
          localStorage.setItem("mtk_pw", h53("mtk:" + p));
          alert(
            "Sandi diganti. Catatan: sandi ini hanya berlaku di browser ini.",
          );
        } catch (e) {
          alert("Gagal menyimpan sandi.");
        }
      }
      async function hapusSemua() {
        if (
          !confirm(
            "Hapus SEMUA data nilai siswa? Tindakan ini tidak dapat dibatalkan.",
          )
        )
          return;

        try {
          await DB.clear();
          alert("Data siswa berhasil dihapus.");
          V.p.rows = null;
          render(1);
        } catch (e) {
          console.error("Gagal menghapus data:", e);
          alert("Gagal menghapus data: " + (e.message || e));
        }
      }
      function csv() {
        const q = (v) => {
            v = String(v);
            if (/^[=+\-@]/.test(v)) v = "'" + v;
            return '"' + v.replace(/"/g, '""') + '"';
          },
          f = V.p.f || "";
        const rows = (V.p.rows || [])
          .filter((r) => !f || r.kode === f)
          .map((r) =>
            [
              r.nama,
              r.kode,
              r.skor,
              r.maks,
              r.nilai,
              r.benar,
              r.salah,
              r.prog,
              r.status,
              r.t,
            ]
              .map(q)
              .join(","),
          );
        const b = new Blob(
            [
              "\ufeff" +
                [
                  "Nama",
                  "Kelas",
                  "Skor",
                  "Skor Maks",
                  "Nilai",
                  "Benar",
                  "Salah",
                  "Progres (%)",
                  "Status",
                  "Waktu",
                ]
                  .map(q)
                  .join(",") +
                "\n" +
                rows.join("\n"),
            ],
            { type: "text/csv" },
          ),
          a = document.createElement("a");
        a.href = URL.createObjectURL(b);
        a.download = "rekap-nilai-satuan-panjang.csv";
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      }
      function fin(q, p, sel) {
        const full = p === q.w;
        S.ans[q.id] = {
          p,
          sel,
          e: full ? pick(["senang", "semangat"]) : p > 0 ? "semangat" : "pikir",
          m: full
            ? pick([
                "Hebat! Jawabanmu benar!",
                "Keren! Kamu pintar sekali!",
                "Tepat sekali, teman!",
              ])
            : p > 0
              ? "Lumayan! Sebagian jawabanmu sudah benar."
              : "Belum tepat. Ayo coba lagi di soal berikutnya!",
        };
        if (p > 0) {
          plus("+" + fm(p));
          burst(full ? 16 : 6);
          S.pop = true;
        }
        save();
        render(1);
      }
      function pk(id, j) {
        const q = Qb(id);
        if (S.ans[q.id]) return;
        fin(q, j === q.a ? q.w : 0, j);
      }
      function tm(id, k, v) {
        S.tmp[id][k] = v;
        const q = Qb(id);
        $("#chk").disabled = !q.pairs.every((p, i) => S.tmp[id][i]);
      }
      function od(id, v) {
        const t = S.tmp[id] || (S.tmp[id] = []);
        if (t.length < 4 && t.indexOf(v) < 0) t.push(v);
        render(1);
      }
      function pn(s) {
        s = String(s).trim().replace(/\s+/g, "");
        if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, "").replace(",", ".");
        else s = s.replace(",", ".");
        return /^\d+(\.\d+)?$/.test(s) ? parseFloat(s) : NaN;
      }
      function ck(id) {
        const q = Qb(id), t = S.tmp[id] || [];
        if (S.ans[id]) return;
        if (q.type === "num") {
          const raw = $("#ni").value, v = pn(raw);
          if (isNaN(v)) return err("Tulis angkanya dulu ya, tanpa satuan.");
          return fin(q, Math.abs(v - q.ans) < 1e-9 ? q.w : 0, raw.trim());
        }
        const c = q.type === "match"
          ? q.pairs.filter((p, k) => t[k] === p[1]).length
          : q.ord.filter((x, k) => t[k] === x).length;
        fin(q, (c * q.w) / 4, 0);
      }

          ["✏️", "Jawab dengan teliti", "Siapkan kertas coretan. Untuk soal isian, tulis angkanya saja (boleh pakai titik, contoh 1.800). Jawaban yang sudah dikirim tidak bisa diganti."],
          ["⭐", "Kumpulkan koin, bintang, dan lencana", "Boleh keluar kapan saja, progresmu tersimpan. Masuk lagi dengan nama dan kode kelas yang sama untuk lanjut."],
        ].map((s, i) => '<li><span class="n">' + (i + 1) + '</span><span class="e" aria-hidden="true">' + s[0] + "</span><div><b>" + s[1] + "</b><p>" + s[2] + "</p></div></li>").join("");
        return '<div class="card c hero">' + nt + '<div class="hero-top"><img class="logo" src="' + LOGO + '" alt="Logo SD Telkom Makassar"><span class="kick">📐 Matematika • Kelas IV SD</span><h1 class="ttl">HUBUNGAN ANTARSATUAN<em>PANJANG</em></h1><p class="sub">Bab 3 Pengukuran Panjang dan Berat<br>Petualangan Bangjack di Tangga Satuan</p><div class="chips">' + chips + "</div></div>" + sceneHero() + "</div>" +
          '<div class="card c">' + bub("semangat", "Halo! Aku Bangjack, pemandu petualanganmu. Ayo kuasai tangga satuan panjang dan jadi Bintang Ukur! Siapa kamu hari ini?") +
          '<div class="row" style="justify-content:center"><button class="btn go big" onclick="go(\'siswa\')">🎒 Mode Siswa</button><button class="btn warn big" onclick="go(\'guru\')">🧑‍🏫 Mode Guru</button></div>' + (DB.note ? '<p class="meta">' + DB.note + "</p>" : "") + "</div>" +
          ytCard("🎬 Video Pembelajaran", "Tonton videonya sampai selesai, lalu mulai petualanganmu!") +
          '<div class="card"><h2>📜 Petunjuk Bermain</h2><ol class="steps">' + st + '</ol><h3 style="margin-top:14px">Tiga level yang akan kamu lewati</h3><div class="grid">' + trip + '</div><div class="tile" style="margin-top:12px">🎵 <b>Musik:</b> tekan tombol 🎵 di pojok kanan bawah untuk menyalakan atau mematikan musik kapan saja.</div><p class="c" style="margin:10px 0 0"><button class="btn go big" onclick="go(\'siswa\')">🎒 Aku siap, ayo mulai!</button></p></div>';
      }

      /* ===== MUSIK LATAR (dibuat langsung oleh browser, tanpa file audio) ===== */
      const MUS = {
        ctx: null,
        m: null,
        nb: null,
        on: false,
        ever: false,
        tm: null,
        st: 0,
        nt: 0,
        wasOn: false,
        BPM: 104,
        F: [
          261.63, 293.66, 329.63, 392, 440, 523.25, 587.33, 659.25, 783.99, 880,
        ],
        MEL: [
          5, -1, 7, 8, 7, -1, 5, -1, 6, -1, 8, 9, 8, -1, 6, -1, 4, -1, 5, 6, 5,
          -1, 4, -1, 5, 6, 7, -1, 6, 5, 3, -1, 5, -1, 7, 8, 9, -1, 8, 7, 8, -1,
          7, 6, 7, -1, 5, -1, 6, 7, 8, -1, 7, 6, 5, -1, 5, -1, 3, -1, 5, -1, -1,
          -1,
        ],
        ROOT: [130.81, 98, 110, 87.31, 130.81, 98, 87.31, 130.81],
        start() {
          try {
            if (!this.ctx) {
              const A = window.AudioContext || window.webkitAudioContext;
              if (!A) return;
              const c = (this.ctx = new A()),
                k = c.createDynamicsCompressor(),
                g = c.createGain();
              g.gain.value = 0.5;
              g.connect(k);
              k.connect(c.destination);
              this.m = g;
              const b = (this.nb = c.createBuffer(
                  1,
                  Math.floor(c.sampleRate * 0.5),
                  c.sampleRate,
                )),
                d = b.getChannelData(0);
              for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
            }
            this.ctx.resume();
            this.ever = true;
            if (!this.on) {
              this.on = true;
              this.st = 0;
              this.nt = this.ctx.currentTime + 0.08;
              this.tm = setInterval(() => this.tick(), 60);
            }
            document.body.classList.add("mon");
          } catch (e) {}
          this.ui();
        },
        stop() {
          this.on = false;
          clearInterval(this.tm);
          this.tm = null;
          document.body.classList.remove("mon");
          this.ui();
        },
        toggle() {
          this.on ? this.stop() : this.start();
        },
        ui() {
          const b = document.getElementById("mbtn");
          if (!b) return;
          b.textContent = this.on
            ? "🎵 Musik: Nyala"
            : this.ever
              ? "🔇 Musik: Mati"
              : "🎵 Putar Musik";
          b.setAttribute("aria-pressed", String(this.on));
          b.classList.toggle("pulse", !this.ever);
        },
        tick() {
          const c = this.ctx;
          while (this.nt < c.currentTime + 0.25) {
            this.play(this.st % 64, this.nt);
            this.nt += 60 / this.BPM / 2;
            this.st++;
          }
        },
        play(s, t) {
          const b = s % 8,
            bar = s >> 3,
            n = this.MEL[s];
          if (n >= 0) {
            this.pluck(this.F[n], t, 0.3, 0.18);
            this.pluck(this.F[n], t + 0.13, 0.12, 0.08);
          }
          if (b === 0 || b === 4) {
            this.bass(this.ROOT[bar], t, 1);
            this.kick(t);
          }
          if (b === 2 || b === 6) {
            this.bass(this.ROOT[bar] * 1.5, t, 0.55);
            this.block(t);
          }
          this.hat(t, b % 2 ? 0.6 : 0.3);
        },
        env(o, t, v, d) {
          const g = this.ctx.createGain();
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(v, t + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t + d);
          o.connect(g);
          g.connect(this.m);
          o.start(t);
          o.stop(t + d + 0.05);
        },
        osc(ty, f, t, v, d) {
          const o = this.ctx.createOscillator();
          o.type = ty;
          o.frequency.value = f;
          this.env(o, t, v, d);
        },
        pluck(f, t, v, d) {
          this.osc("triangle", f, t, v, d + 0.35);
          this.osc("sine", f * 2, t, v * 0.35, d + 0.2);
        },
        bass(f, t, k) {
          this.osc("sine", f, t, 0.55 * k, 0.32);
          this.osc("triangle", f * 2, t, 0.12 * k, 0.2);
        },
        kick(t) {
          const o = this.ctx.createOscillator();
          o.type = "sine";
          o.frequency.setValueAtTime(150, t);
          o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
          this.env(o, t, 0.7, 0.2);
        },
        block(t) {
          this.osc("triangle", 950, t, 0.16, 0.07);
        },
        hat(t, v) {
          const c = this.ctx,
            s = c.createBufferSource(),
            f = c.createBiquadFilter(),
            g = c.createGain();
          s.buffer = this.nb;
          f.type = "highpass";
          f.frequency.value = 7000;
          g.gain.setValueAtTime(0.07 * v, t);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
          s.connect(f);
          f.connect(g);
          g.connect(this.m);
          s.start(t);
          s.stop(t + 0.06);
        },
      };
      function firstTap(e) {
        if (MUS.ever) return;
        if (e.target && e.target.closest && e.target.closest("#mbtn")) return;
        MUS.start();
      }
      document.addEventListener("click", firstTap, true);
      document.addEventListener(
        "keydown",
        (e) => {
          if (e.key === "Enter" || e.key === " ") firstTap(e);
        },
        true,
      );
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          MUS.wasOn = MUS.on;
          if (MUS.on) MUS.stop();
        } else if (MUS.wasOn) {
          MUS.wasOn = false;
          MUS.start();
        }
      });
      window.addEventListener("blur", () =>
        setTimeout(() => {
          const a = document.activeElement;
          if (a && a.tagName === "IFRAME" && MUS.on) MUS.stop();
        }, 0),
      );

      /* ===== TAMBAHAN: VIDEO DI PETA, MATERI AWAL, DAN TOMBOL 🎬 ===== */
      const _peta = VIEWS.peta, _mat = VIEWS.materi, _hud = hud;
      VIEWS.peta = () => _peta() + ytCard("🎬 Video Pembelajaran", "Tonton lagi kapan saja tanpa keluar dari halaman ini.");
      VIEWS.materi = () => _mat() + (V.p.l === 1 && V.p.i === 0 ? ytCard("🎬 Tonton Videonya Dulu", "Video diputar langsung di sini. Matikan musik 🎵 saat menonton.") : "");
      hud = function () {
        _hud();
        const b = document.querySelector('#hud button[aria-label="Ke peta"]');
        if (b) b.insertAdjacentHTML("afterend", ' <button class="btn ghost" style="min-height:34px;padding:4px 10px;margin:0" onclick="vid()" aria-label="Tonton video">🎬</button>');
      };

      DB.init().then(() => render());
    </script>
  </body>
</html>
